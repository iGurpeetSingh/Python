name: Verify Guri Cloud and Device Agents

on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - "agents/**"
      - "Dockerfile"
      - "render.yaml"
      - ".github/workflows/verify-guri.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "agents/**"
      - "Dockerfile"
      - "render.yaml"
      - ".github/workflows/verify-guri.yml"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile backend and device agents
        run: python -m compileall -q backend agents
      - name: Run command parser and cloud routing tests
        working-directory: backend
        run: python -m unittest discover -s tests -v

  react-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend packages and build
        working-directory: frontend
        run: |
          npm install
          npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production Guri Cloud image
        run: docker build --tag guri-cloud:ci .
