name: Python Paper API checks

on:
  push:
    paths:
      - "backend/app/**"
      - "backend/tests/**"
      - ".github/workflows/python-paper-api.yml"
  pull_request:
    paths:
      - "backend/app/**"
      - "backend/tests/**"
      - ".github/workflows/python-paper-api.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install API test dependencies
        run: python -m pip install "fastapi>=0.115,<1" "httpx>=0.27,<1"
      - name: Compile backend
        run: python -m compileall -q backend/app backend/tests
      - name: Run paper API tests
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -v
